name: Render FacebookCoachingAd
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'facebook-coaching-ad/**'
      - '.github/workflows/facebook-coaching-ad-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: facebook-coaching-ad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: FacebookCoachingAd-MP4
          path: facebook-coaching-ad/out/FacebookCoachingAd.mp4
          if-no-files-found: error
          retention-days: 30
