name: Render ChristianCoachingFacebookAd
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'christian-coaching-facebook-ad/**'
      - '.github/workflows/christian-coaching-facebook-ad-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: christian-coaching-facebook-ad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: ChristianCoachingFacebookAd-MP4
          path: christian-coaching-facebook-ad/out/ChristianCoachingFacebookAd.mp4
          if-no-files-found: error
          retention-days: 30
