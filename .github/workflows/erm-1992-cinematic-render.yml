name: Render ERM1992
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'erm-1992-cinematic/**'
      - '.github/workflows/erm-1992-cinematic-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: erm-1992-cinematic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: ERM1992-MP4
          path: erm-1992-cinematic/out/ERM1992.mp4
          if-no-files-found: error
          retention-days: 30
