name: Render AXIOME 01 - Le gouvernement contre le pari
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '01-le-gouvernement-contre-le-pari/**'
      - '.github/workflows/axiome-01-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: 01-le-gouvernement-contre-le-pari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Build and validate compositions
        run: bun run build
      - name: Render horizontal 16:9 and vertical Short 9:16
        run: bun run render
      - name: Upload MP4 files
        uses: actions/upload-artifact@v4
        with:
          name: AXIOME-01-Le-Gouvernement-Contre-Le-Pari-MP4
          path: |
            01-le-gouvernement-contre-le-pari/out/01_Le_Gouvernement_Contre_Le_Pari_16x9.mp4
            01-le-gouvernement-contre-le-pari/out/01_Le_Gouvernement_Contre_Le_Pari_Short_9x16.mp4
          if-no-files-found: error
          retention-days: 30
