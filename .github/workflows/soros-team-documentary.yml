name: Render SorosAndTeam1992
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'soros-team-documentary/**'
      - '.github/workflows/soros-team-documentary.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soros-team-documentary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: mkdir -p public/portraits && curl -fL 'https://commons.wikimedia.org/wiki/Special:Redirect/file/George_Soros.jpg' -o public/portraits/soros.jpg
      - run: test -s public/portraits/druckenmiller.jpg || (echo 'Licensed Druckenmiller photograph required' && exit 1)
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: SorosAndTeam1992-MP4
          path: soros-team-documentary/out/SorosAndTeam1992.mp4
          if-no-files-found: error
