name: Render HealthyDiabetesMeal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['healthy-diabetes-meal/**','.github/workflows/healthy-diabetes-meal-render.yml']
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: healthy-diabetes-meal
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: HealthyDiabetesMeal-MP4
          path: healthy-diabetes-meal/out/HealthyDiabetesMeal.mp4
          if-no-files-found: error
          retention-days: 30
