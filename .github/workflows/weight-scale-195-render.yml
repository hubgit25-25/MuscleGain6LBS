name: Render WeightScale195
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'weight-scale-195/**'
      - '.github/workflows/weight-scale-195-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: weight-scale-195
    steps:
      - uses: actions/checkout@v4
      - name: Check required realistic footage
        run: |
          if [ ! -s public/athlete-on-scale.mp4 ]; then
            echo "::error::Missing public/athlete-on-scale.mp4. Upload a real or AI-generated 4-second MP4 before rendering. No SVG avatar fallback."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun i
      - name: Build and validate
        run: bun run build
      - name: Render MP4 H.264
        run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: WeightScale195-MP4
          path: weight-scale-195/out/WeightScale195.mp4
          if-no-files-found: error
          retention-days: 30
