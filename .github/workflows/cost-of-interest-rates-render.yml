name: Render CostOfInterestRates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cost-of-interest-rates/**'
      - '.github/workflows/cost-of-interest-rates-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: cost-of-interest-rates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: CostOfInterestRates-MP4
          path: cost-of-interest-rates/out/CostOfInterestRates.mp4
          if-no-files-found: error
          retention-days: 30
