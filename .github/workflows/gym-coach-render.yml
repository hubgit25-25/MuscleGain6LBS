name: Render GymCoachScene
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gym-coach/**'
      - '.github/workflows/gym-coach-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gym-coach
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun i
      - name: Build and validate composition
        run: bun run build
      - name: Render MP4 H.264
        run: bun run render
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: GymCoachScene-MP4
          path: gym-coach/out/GymCoachScene.mp4
          retention-days: 30
          if-no-files-found: error
