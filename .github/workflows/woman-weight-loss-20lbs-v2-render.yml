name: Render WomanWeightLoss20LBS V2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'woman-weight-loss-20lbs-v2/**'
      - '.github/workflows/woman-weight-loss-20lbs-v2-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: woman-weight-loss-20lbs-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Validate realistic source images
        run: |
          test -s public/before.jpg || (echo "Missing new public/before.jpg" && exit 1)
          test -s public/after.jpg || (echo "Missing new public/after.jpg" && exit 1)
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: WomanWeightLoss20LBS-V2-MP4
          path: woman-weight-loss-20lbs-v2/out/WomanWeightLoss20LBS.mp4
          if-no-files-found: error
          retention-days: 30
