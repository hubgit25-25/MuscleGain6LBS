name: Render AnimatedCaptions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'animated-captions/**'
      - '.github/workflows/animated-captions-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: animated-captions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: CaptionsPreview-MP4
          path: animated-captions/out/CaptionsPreview.mp4
          if-no-files-found: error
          retention-days: 30
