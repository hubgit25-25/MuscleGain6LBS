name: Render FemaleMuscleGrowth
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'female-muscle-growth-3d/**'
      - '.github/workflows/female-muscle-growth-3d-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: female-muscle-growth-3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: FemaleMuscleGrowth-MP4
          path: female-muscle-growth-3d/out/FemaleMuscleGrowth.mp4
          if-no-files-found: error
          retention-days: 30
