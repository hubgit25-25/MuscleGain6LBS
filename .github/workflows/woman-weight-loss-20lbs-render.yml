name: Render WomanWeightLoss20LBS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'woman-weight-loss-20lbs/**'
      - '.github/workflows/woman-weight-loss-20lbs-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: woman-weight-loss-20lbs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Validate photorealistic source assets
        run: |
          test -s public/before.jpg || (echo "Missing public/before.jpg — upload a photorealistic adult woman on a scale" && exit 1)
          test -s public/after.jpg || (echo "Missing public/after.jpg — upload same woman after transformation" && exit 1)
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: WomanWeightLoss20LBS-MP4
          path: woman-weight-loss-20lbs/out/WomanWeightLoss20LBS.mp4
          if-no-files-found: error
          retention-days: 30
