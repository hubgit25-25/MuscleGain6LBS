name: Render EuropeanTensions1992
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'european-tensions-1992/**'
      - '.github/workflows/european-tensions-1992-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: european-tensions-1992
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Prepare verified archival photographs and geographical map
        run: |
          python3 -m pip install --quiet pillow --break-system-packages
          python3 scripts/prepare_assets.py
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: EuropeanTensions1992-MP4
          path: european-tensions-1992/out/EuropeanTensions1992.mp4
          if-no-files-found: error
          retention-days: 30
