name: Render DoubtBecomesSelling1992
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'doubt-becomes-selling-1992/**'
      - '.github/workflows/doubt-becomes-selling-1992-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: doubt-becomes-selling-1992
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: DoubtBecomesSelling1992-MP4
          path: doubt-becomes-selling-1992/out/DoubtBecomesSelling1992.mp4
          if-no-files-found: error
          retention-days: 30
