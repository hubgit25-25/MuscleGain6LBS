name: Render CoachListening
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['coach-listening/**','.github/workflows/coach-listening-render.yml']
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: coach-listening
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: CoachListening-MP4
          path: coach-listening/out/CoachListening.mp4
          if-no-files-found: error
          retention-days: 30
