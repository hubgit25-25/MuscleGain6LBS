name: Render FemaleMuscleTransformation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'female-full-body-muscle-transformation/**'
      - '.github/workflows/female-full-body-muscle-transformation-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: female-full-body-muscle-transformation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun run build
      - run: bun run render
      - uses: actions/upload-artifact@v4
        with:
          name: FemaleMuscleTransformation-MP4
          path: female-full-body-muscle-transformation/out/FemaleMuscleTransformation.mp4
          if-no-files-found: error
          retention-days: 30
